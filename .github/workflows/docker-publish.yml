name: Build and Publish Docker Image
run-name: Build & publish mini-scraper image (base ${{ inputs.base_image_tag }})

on:
  workflow_dispatch:
    inputs:
      base_image_tag:
        description: 'Playwright base image tag (IMAGE_TAG build arg)'
        required: false
        default: 'v1.61.0-noble'
        type: string

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute image version
        id: version
        # A GitHub Actions checkout is always a clean tree, so ci/version.sh
        # will never take its dirty/dev-build branch here - this always
        # produces a release version.
        run: |
          set -euo pipefail
          VERSION=$(ci/version.sh)
          echo "Computed version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: Docker/Files
          file: Docker/dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            IMAGE_TAG=${{ inputs.base_image_tag }}
          tags: |
            docker.io/jnitecki/mini-scraper:${{ steps.version.outputs.version }}
            docker.io/jnitecki/mini-scraper:latest
