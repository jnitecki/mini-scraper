name: Build and Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      base_image_tag:
        description: 'Playwright base image tag (IMAGE_TAG build arg)'
        required: false
        default: 'v1.61.0-noble'
        type: string

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute image version
        id: version
        run: |
          set -euo pipefail
          git fetch --tags --force

          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            DIRTY=true
          else
            DIRTY=false
          fi

          if DESCRIBE=$(git describe --tags --long --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null); then
            TAG=$(echo "$DESCRIBE" | sed -E 's/^(.*)-([0-9]+)-g[0-9a-f]+$/\1/')
            COMMITS_SINCE=$(echo "$DESCRIBE" | sed -E 's/^(.*)-([0-9]+)-g[0-9a-f]+$/\2/')
            MAJOR=$(echo "$TAG" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/\1/')
            MINOR=$(echo "$TAG" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/\2/')
            PATCH=$(echo "$TAG" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/\3/')
          else
            # No version tag reachable yet: baseline v0.1.0, revision counted from all commits
            MAJOR=0
            MINOR=1
            PATCH=0
            COMMITS_SINCE=$(git rev-list --count HEAD)
          fi

          REVISION=$((PATCH + COMMITS_SINCE))

          if [ "$DIRTY" = "true" ]; then
            # Uncommitted tracked changes: version the next revision as a dev build
            NEXT=$((REVISION + 1))
            VERSION="v${MAJOR}.${MINOR}.dev${NEXT}"
            IS_RELEASE=false
          elif [ "$COMMITS_SINCE" -eq 0 ]; then
            # Clean tree, HEAD is exactly on a version tag: use it as-is
            VERSION="v${MAJOR}.${MINOR}.${PATCH}"
            IS_RELEASE=true
          else
            # Clean tree, HEAD is past the last version tag: bump revision per commit
            VERSION="v${MAJOR}.${MINOR}.${REVISION}"
            IS_RELEASE=true
          fi

          echo "Computed version: $VERSION (dirty=$DIRTY, release=$IS_RELEASE)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "$IS_RELEASE" = "true" ]; then
            TAGS="docker.io/jnitecki/mini-scraper:${VERSION}
docker.io/jnitecki/mini-scraper:latest"
          else
            TAGS="docker.io/jnitecki/mini-scraper:${VERSION}"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: Docker/Files
          file: Docker/dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            IMAGE_TAG=${{ inputs.base_image_tag }}
          tags: ${{ steps.version.outputs.tags }}
